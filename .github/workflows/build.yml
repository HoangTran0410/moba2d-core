name: Build

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Lifted to the job so the deploy step below can ask whether the token
    # exists: the `secrets` context is not available in an `if:`, but `env` is.
    # Without that guard a fork — or this repo before the secrets are added —
    # would go red on a deploy nobody configured.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Playwright's own Chromium, for the real-browser boot step below.
      # `LOL2D_CHROME_CHANNEL=` (empty) is what makes `tests/e2e/harness.mjs`
      # use it instead of system Chrome, which no runner has.
      - run: npx --yes playwright install --with-deps chromium

      # p5 is a global loaded by `index.html` from `/vendor/p5.min.js`, and
      # `public/vendor/` is git-ignored — `scripts/copy-vendor.mjs` fills it,
      # from `predev`/`prebuild`. `tests/e2e/harness.mjs` starts Vite through
      # its API, so neither hook runs, and a checkout that has not built yet
      # serves a 404 for p5: the game never boots, `#play-btn` never appears,
      # and the browser step below times out after 30s. Locally this hides —
      # any earlier `npm run dev` or `npm run build` has already left the file
      # on disk. Cheap enough to run unconditionally rather than depend on
      # step ordering.
      - run: npm run vendor:copy

      # **Content-pack-and-repo-split batch 6 task 10: `packs/riot/` is no
      # longer in this tree to move**, so `npm run verify:without-packs` (the
      # departure drill: move the pack aside, reinstall, verify, build, boot
      # a browser, restore) now finds nothing to depart and exits after
      # printing "drill skipped — nothing to depart"
      # (`scripts/verify-without-packs.mjs`) without ever launching a
      # browser. It is retired-but-kept in `package.json`, not deleted: doc
      # comments across `vitest.config.ts`, `tests/setup.ts`,
      # `src/testing/index.ts`, `src/content/install.ts` and others still
      # point a reader at it as the thing that proved core stands alone, and
      # it is real again the day a second optional pack exists to drill
      # against.
      #
      # This step is therefore `e2e:core-alone` instead: the only step in
      # this whole workflow that boots a real browser to a real, playable
      # match — on the reference pack's map, since no optional pack is
      # installed — rather than only typechecking and unit-testing one.
      # `verify:all` below has no e2e step of its own.
      - run: npm run e2e:core-alone
        env:
          LOL2D_CHROME_CHANNEL: ''

      - run: npm run verify:all

      # ------------------------------------------- the game that gets published
      # Everything above this line proves CORE, alone: no optional pack in the
      # tree, `installedPacks` generated empty, one champion. That is what this
      # repository is and what it must keep being — `package.json` names no
      # content pack on purpose, and adding one there would quietly make every
      # gate above run against a roster instead of against the engine.
      #
      # So the published artifact is composed here instead. `--no-save` is the
      # whole trick: the pack lands in `node_modules`, `prebuild`'s
      # `packs:generate` finds it (scripts/installed-packs.mjs reads
      # `node_modules`, never `package.json`), and the checkout records no
      # dependency on it. `npm run build` then produces a dist with content in
      # it, and that dist is what the Pages steps below upload.
      #
      # This is also the only place the two halves are ever built together.
      # Core's `verify` sees core; the pack's own repository runs the pack's
      # own gates; neither sees the composition — and the composition is
      # exactly where the failure that cost a full debugging pass lived, a
      # pack resolved out of `node_modules` being pre-bundled by esbuild,
      # which does not honour Vite's `?raw`. The grep is the real assertion:
      # the barrel is generated from what is installed, so if the pack did not
      # arrive the string is simply absent and a silent zero-champion build
      # would otherwise sail through `chunks:check` (which only checks that
      # the packs it *finds* got their chunks — it is happy with none).
      - name: Build the published game — core plus the content pack
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          npm install --no-save github:HoangTran0410/moba2d-content-riot
          npm run build
          grep -q "@moba2d/content-riot" src/generated/installedPacks.ts \
            || { echo "::error::the content pack did not reach the build"; exit 1; }
          npm run chunks:check

      # `npm run verify:all` runs core's own `verify` (which ends in `vite
      # build`) plus `packs/reference`'s own asset/catalogue/typecheck/seam
      # gates — the one workspace still inside this repository. On a push to
      # main the compose step above then *overwrites* that dist with the
      # core-plus-content build, and that second one is what ships; the first
      # is the one `verify` gated. Elsewhere — a pull request, a fork — the
      # compose step does not run and the verified core-only dist is the only
      # one there is. CI runs `verify:all` and
      # never plain `verify`, and that is not a temporary arrangement:
      # `verify` is scoped to core *by intent* (content-pack-extraction batch
      # 5 task 6), and a pack's own gates are the pack's own to run —
      # `@moba2d/content-riot` runs its own now, in its own repository and
      # its own workflow, not here.
      #
      # This comment used to say that `verify` still compiled and tested the
      # riot pack — that `src/content/install.ts` statically imported
      # `packs/riot/pack`, that `vue-tsc` stopped there with `error TS2307`
      # with `packs/` moved aside, and that closing it was "a later task's
      # job". That task is content-pack-extraction batch 5 task 8 and it is
      # done: the barrel that would have named the riot pack,
      # `src/generated/installedPacks.ts`, is generated empty now that no
      # optional pack is installed in this tree at all (content-pack-and-
      # repo-split batch 6 task 10 is what made that permanent rather than a
      # drill's temporary state), so `verify` passes the same way it always
      # did with the pack moved aside. `install.ts` is still static and
      # synchronous, which spec §9.1 requires of it; what became conditional
      # is the generated list of imports, not the imports themselves — the
      # departure drill step above is what holds that true rather than a
      # comment claiming it, on whichever optional pack is installed next.
      #
      # Nothing ships that did not pass typecheck and the whole suite first —
      # that is the point of deploying from here rather than connecting the
      # repo to Cloudflare's own git builds, which would publish a red main.
      # With the split that sentence needs its second half: the suite that
      # gated the shipped bytes is *two* suites in two repositories, core's
      # here and the pack's in its own, and what this job adds on top is the
      # only check either of them structurally cannot do — that the two
      # actually compose into a build.
      - name: Deploy to Cloudflare Pages
        if: >-
          github.event_name == 'push'
          && github.ref == 'refs/heads/main'
          && env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 pages deploy dist --project-name=lol2d --branch=main

      # Opt-in, exactly like the Cloudflare step above is opt-in on its
      # secret — and for the same reason, learned the same way. That step
      # guards on `CLOUDFLARE_API_TOKEN != ''` so a repository nobody
      # configured to deploy does not go red on a deploy nobody asked for;
      # these three steps had no such guard, only "is this main", so the
      # first push to a *second* core repository failed on
      # `configure-pages`: "Get Pages site failed. Please verify that the
      # repository has Pages enabled". Every engine gate in the job had
      # already passed. Publishing is a property of one repository, not of
      # the branch name — set the `PUBLISH_PAGES` repository variable to
      # `true` where the game actually ships from, and a fork or a test
      # clone stays green without publishing anything.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLISH_PAGES == 'true'
        uses: actions/configure-pages@v5
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLISH_PAGES == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLISH_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
