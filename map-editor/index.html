<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0b0e13">
    <title>MOBA2D Map Editor</title>

    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1117'/%3E%3Cpath d='M7 12.5 16 7l9 5.5-9 5.5-9-5.5Z' fill='none' stroke='%23c8aa6e' stroke-width='2.2' stroke-linejoin='round'/%3E%3Cpath d='m7 19.5 9 5.5 9-5.5' fill='none' stroke='%2329d3c4' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

    <link rel="stylesheet" href="/map-editor/css/style.css">

    <!-- Hai lib, cả hai chạy offline 100%.
         - decomp: cắt polygon lõm thành mảnh lồi, thứ game cần (5KB).
         - polygon-clipping: phép ngược lại, gộp mảnh về hình gốc (28KB).
           Là thư viện chứ không tự viết vì bản tự viết sai trên map thật —
           xem `Geom.union` trong src/mapEditor/geom.ts. -->
    <script src="/map-editor/lib/decomp.min.js"></script>
    <script src="/map-editor/lib/polygon-clipping.min.js"></script>
</head>

<body>
    <!-- ===================== icon sprite ===================== -->
    <svg id="icon-sprite" aria-hidden="true">
        <defs>
            <g id="i-layers">
                <path d="M12 2.5 2.5 7 12 11.5 21.5 7 12 2.5Z" />
                <path d="m2.5 16.5 9.5 4.5 9.5-4.5" />
                <path d="m2.5 11.8 9.5 4.5 9.5-4.5" />
            </g>
            <g id="i-plus">
                <path d="M12 5v14M5 12h14" />
            </g>
            <g id="i-folder">
                <path d="M4 20h15a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-6.6l-1.7-2H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2Z" />
            </g>
            <g id="i-save">
                <path d="M12 3.5v11.5" />
                <path d="m7.5 10.5 4.5 4.5 4.5-4.5" />
                <path d="M4 20.5h16" />
            </g>
            <g id="i-route">
                <circle cx="5.5" cy="18.5" r="2.6" />
                <circle cx="18.5" cy="5.5" r="2.6" />
                <path d="M8.1 18.5h5.4a4 4 0 0 0 0-8H10a4 4 0 0 1 0-8h5.9" />
            </g>
            <g id="i-flag">
                <path d="M5 21V4" />
                <path d="M5 4.5h11l-2.2 4 2.2 4H5" />
            </g>
            <g id="i-import">
                <path d="M12 20.5V9" />
                <path d="m7.5 13.5 4.5-4.5 4.5 4.5" />
                <path d="M4 3.5h16" />
            </g>
            <g id="i-code">
                <path d="m9 17.5-5.5-5.5L9 6.5" />
                <path d="m15 6.5 5.5 5.5L15 17.5" />
            </g>
            <g id="i-trash">
                <path d="M4 6.5h16" />
                <path d="M10 11v6M14 11v6" />
                <path d="M6.5 6.5 7.5 19a2 2 0 0 0 2 1.9h5a2 2 0 0 0 2-1.9l1-12.5" />
                <path d="M9.5 6.5v-2a1.5 1.5 0 0 1 1.5-1.5h2a1.5 1.5 0 0 1 1.5 1.5v2" />
            </g>
            <g id="i-undo">
                <path d="M8.5 14 3.5 9l5-5" />
                <path d="M3.5 9h11a5.5 5.5 0 0 1 0 11h-4" />
            </g>
            <g id="i-redo">
                <path d="m15.5 14 5-5-5-5" />
                <path d="M20.5 9h-11a5.5 5.5 0 0 0 0 11h4" />
            </g>
            <g id="i-cursor">
                <path d="M5.2 3.4 19.4 10.2a.6.6 0 0 1-.1 1.1l-5.4 1.5a1.6 1.6 0 0 0-1.1 1.1l-1.5 5.4a.6.6 0 0 1-1.1.1L3.4 5.2a.6.6 0 0 1 .8-.8Z" />
            </g>
            <g id="i-hand">
                <path d="M8 12V6.2a1.6 1.6 0 0 1 3.2 0V11" />
                <path d="M11.2 11V5a1.6 1.6 0 0 1 3.2 0v6" />
                <path d="M14.4 11.5V7.4a1.6 1.6 0 0 1 3.2 0V15" />
                <path d="M8 12v-1.4a1.6 1.6 0 0 0-3.2 0V14a7 7 0 0 0 7 7h1.8a5 5 0 0 0 5-5" />
            </g>
            <g id="i-marquee">
                <path d="M3.5 8V5.5a2 2 0 0 1 2-2H8" />
                <path d="M16 3.5h2.5a2 2 0 0 1 2 2V8" />
                <path d="M20.5 16v2.5a2 2 0 0 1-2 2H16" />
                <path d="M8 20.5H5.5a2 2 0 0 1-2-2V16" />
                <path d="M11 3.5h2M11 20.5h2M3.5 11v2M20.5 11v2" />
            </g>
            <g id="i-pen">
                <path d="m12 4.4 7 4.6-2.6 8H7.6L5 9l7-4.6Z" />
                <circle cx="12" cy="4.4" r="1.7" />
                <circle cx="19" cy="9" r="1.7" />
                <circle cx="16.4" cy="17" r="1.7" />
                <circle cx="7.6" cy="17" r="1.7" />
                <circle cx="5" cy="9" r="1.7" />
            </g>
            <g id="i-square-plus">
                <rect x="3.5" y="3.5" width="17" height="17" rx="3" />
                <path d="M12 8.5v7M8.5 12h7" />
            </g>
            <g id="i-copy">
                <rect x="8.5" y="8.5" width="12" height="12" rx="2.5" />
                <path d="M15.5 8.5v-2a2 2 0 0 0-2-2h-8a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" />
            </g>
            <g id="i-rotate">
                <path d="M20.5 12a8.5 8.5 0 1 1-2.7-6.2" />
                <path d="M20.5 3.2v5h-5" />
            </g>
            <g id="i-grid">
                <rect x="3.5" y="3.5" width="17" height="17" rx="2.5" />
                <path d="M3.5 9.2h17M3.5 14.8h17M9.2 3.5v17M14.8 3.5v17" />
            </g>
            <g id="i-magnet">
                <path d="M4 4.5h4.5v8a3.5 3.5 0 0 0 7 0v-8H20v8a7 7 0 0 1-14 0v-8" />
                <path d="M4 9.5h4.5M15.5 9.5H20" />
            </g>
            <g id="i-image">
                <rect x="3.5" y="4" width="17" height="16" rx="2.5" />
                <circle cx="9" cy="9.5" r="1.6" />
                <path d="m3.9 17.6 4.7-4.4a2 2 0 0 1 2.7 0l5.3 5" />
                <path d="m14.5 15 1.8-1.7a2 2 0 0 1 2.7 0l1.4 1.3" />
            </g>
            <g id="i-eye">
                <path d="M2.2 12S5.6 5.5 12 5.5 21.8 12 21.8 12 18.4 18.5 12 18.5 2.2 12 2.2 12Z" />
                <circle cx="12" cy="12" r="3.2" />
            </g>
            <g id="i-eye-off">
                <path d="M4 4.5 20 20" />
                <path d="M9.7 9.8a3.2 3.2 0 0 0 4.5 4.5" />
                <path d="M6.6 6.8C3.9 8.4 2.2 12 2.2 12s3.4 6.5 9.8 6.5c1.7 0 3.2-.5 4.5-1.2" />
                <path d="M19 15.4c1.7-1.6 2.8-3.4 2.8-3.4S18.4 5.5 12 5.5c-.9 0-1.7.1-2.5.4" />
            </g>
            <g id="i-map">
                <path d="m9 4.2 6 2.1 5-2.1v13.5l-5 2.1-6-2.1-5 2.1V6.3l5-2.1Z" />
                <path d="M9 4.2v13.5M15 6.3v13.5" />
            </g>
            <g id="i-user">
                <circle cx="12" cy="8.2" r="4" />
                <path d="M4.5 20.5a7.5 7.5 0 0 1 15 0" />
            </g>
            <g id="i-zoom-in">
                <circle cx="10.8" cy="10.8" r="7.3" />
                <path d="m16.2 16.2 4.3 4.3" />
                <path d="M10.8 7.8v6M7.8 10.8h6" />
            </g>
            <g id="i-zoom-out">
                <circle cx="10.8" cy="10.8" r="7.3" />
                <path d="m16.2 16.2 4.3 4.3" />
                <path d="M7.8 10.8h6" />
            </g>
            <g id="i-fit">
                <path d="M9 3.5H5.5a2 2 0 0 0-2 2V9" />
                <path d="M15 3.5h3.5a2 2 0 0 1 2 2V9" />
                <path d="M20.5 15v3.5a2 2 0 0 1-2 2H15" />
                <path d="M3.5 15v3.5a2 2 0 0 0 2 2H9" />
            </g>
            <g id="i-target">
                <circle cx="12" cy="12" r="7.5" />
                <circle cx="12" cy="12" r="2" />
                <path d="M12 1.5v3.5M12 19v3.5M1.5 12H5M19 12h3.5" />
            </g>
            <g id="i-help">
                <circle cx="12" cy="12" r="8.8" />
                <path d="M9.4 9.2a2.7 2.7 0 1 1 3.9 2.4c-.8.4-1.3 1.1-1.3 2v.3" />
                <path d="M12 17.2h.01" />
            </g>
            <g id="i-settings">
                <path d="M3.5 7h9M16 7h4.5M3.5 12h4M11 12h9.5M3.5 17h9M16 17h4.5" />
                <circle cx="14.2" cy="7" r="2.2" />
                <circle cx="9.2" cy="12" r="2.2" />
                <circle cx="14.2" cy="17" r="2.2" />
            </g>
            <g id="i-x">
                <path d="m6 6 12 12M18 6 6 18" />
            </g>
            <g id="i-chevron-down">
                <path d="m6 9.5 6 6 6-6" />
            </g>
            <g id="i-more">
                <circle cx="5" cy="12" r="1.6" />
                <circle cx="12" cy="12" r="1.6" />
                <circle cx="19" cy="12" r="1.6" />
            </g>
            <g id="i-search">
                <circle cx="10.8" cy="10.8" r="7.3" />
                <path d="m16.2 16.2 4.3 4.3" />
            </g>
            <g id="i-check">
                <path d="m5 12.8 4.6 4.6L19 6.5" />
            </g>
            <g id="i-edit">
                <path d="M12 20.5h8.5" />
                <path d="M16.4 3.6a2.1 2.1 0 0 1 3 3L7.8 18.2l-4 1 1-4L16.4 3.6Z" />
            </g>
            <g id="i-front">
                <rect x="3.5" y="3.5" width="12" height="12" rx="2" />
                <path d="M8.5 20.5h10a2 2 0 0 0 2-2v-10" />
            </g>
            <!-- Mũi tên rời khỏi màn hình. Khác hẳn `i-back` ngay dưới: cái
                 đó là hai hình chồng nhau, nghĩa "đưa ra sau" trong xếp lớp,
                 và dùng nó cho nút "Về game" thì trông y như nút copy. -->
            <g id="i-arrow-left">
                <path d="M20.5 12h-15" />
                <path d="M11 5.5 4.5 12l6.5 6.5" />
            </g>
            <g id="i-back">
                <rect x="8.5" y="8.5" width="12" height="12" rx="2" />
                <path d="M15.5 3.5h-10a2 2 0 0 0-2 2v10" />
            </g>
            <g id="i-reverse">
                <path d="M3.5 8.5h14" />
                <path d="m13.5 4.5 4 4-4 4" />
                <path d="M20.5 15.5h-14" />
                <path d="m10.5 11.5-4 4 4 4" />
            </g>
            <g id="i-nodes">
                <path d="M6 18.4 12 5.6l6.4 7.4" />
                <rect x="3.9" y="16.3" width="4.2" height="4.2" rx=".9" />
                <rect x="9.9" y="3.5" width="4.2" height="4.2" rx=".9" />
                <rect x="16.3" y="11.3" width="4.2" height="4.2" rx=".9" />
            </g>
            <g id="i-flip-h">
                <path d="M8.5 3.5h-3a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h3" />
                <path d="M15.5 3.5h3a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2h-3" />
                <path d="M12 2.5v2.6M12 9.2v2.6M12 15.9v2.6M12 20.9v.6" />
            </g>
            <g id="i-flip-v">
                <path d="M20.5 8.5v-3a2 2 0 0 0-2-2h-13a2 2 0 0 0-2 2v3" />
                <path d="M20.5 15.5v3a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2v-3" />
                <path d="M2.5 12h2.6M9.2 12h2.6M15.9 12h2.6M20.9 12h.6" />
            </g>
            <g id="i-scale">
                <path d="m4 20 16-16" />
                <path d="M4 14v6h6M20 10V4h-6" />
            </g>
            <g id="i-keyboard">
                <rect x="2.5" y="5.5" width="19" height="13" rx="2.5" />
                <path d="M6.5 9.5h.01M10 9.5h.01M13.5 9.5h.01M17 9.5h.01M6.5 12.5h.01M10 12.5h.01M13.5 12.5h.01M17 12.5h.01M8 15.5h8" />
            </g>
            <g id="i-alert">
                <path d="M10.3 3.9 2.6 17.2a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z" />
                <path d="M12 9.2v4.2M12 17h.01" />
            </g>
            <g id="i-clock">
                <circle cx="12" cy="12" r="8.5" />
                <path d="M12 7v5.2l3.2 2" />
            </g>
            <g id="i-play">
                <path d="M8.5 5.2 19 12 8.5 18.8V5.2Z" />
            </g>
        </defs>
    </svg>

    <!-- ===================== app shell ===================== -->
    <div id="app">
        <canvas id="board" tabindex="0"></canvas>

        <header id="topbar">
            <button class="brand" data-cmd="map.menu" title="Danh sách map (Ctrl+M)">
                <svg class="ico" viewBox="0 0 24 24"><use href="#i-layers" /></svg>
                <span class="brand-name" id="brand-name">Map</span>
                <svg class="ico ico-sm" viewBox="0 0 24 24"><use href="#i-chevron-down" /></svg>
            </button>
            <div id="toolbar-groups" class="tb-groups"></div>
            <div class="tb-spacer"></div>
            <div id="toolbar-right" class="tb-groups"></div>
            <button class="tb-btn" data-cmd="ui.overflow" title="Thêm">
                <svg class="ico" viewBox="0 0 24 24"><use href="#i-more" /></svg>
            </button>
        </header>

        <aside id="inspector" class="panel">
            <div class="panel-head">
                <span id="inspector-title">Thuộc tính</span>
                <button class="icon-btn" data-cmd="ui.inspector" title="Đóng bảng (Tab)">
                    <svg class="ico ico-sm" viewBox="0 0 24 24"><use href="#i-x" /></svg>
                </button>
            </div>
            <div id="inspector-body" class="panel-body"></div>
        </aside>

        <button id="inspector-open" class="fab" data-cmd="ui.inspector" title="Mở bảng thuộc tính (Tab)">
            <svg class="ico" viewBox="0 0 24 24"><use href="#i-settings" /></svg>
        </button>

        <div id="viewdock">
            <div id="minimap-card" class="panel minimap-card hidden">
                <canvas id="minimap"></canvas>
            </div>
            <div class="zoomdock panel">
                <button class="icon-btn" data-cmd="view.zoomOut" title="Thu nhỏ (-)">
                    <svg class="ico ico-sm" viewBox="0 0 24 24"><use href="#i-zoom-out" /></svg>
                </button>
                <button class="zoom-value" id="zoom-value" data-cmd="view.zoomReset" title="Về 100%">100%</button>
                <button class="icon-btn" data-cmd="view.zoomIn" title="Phóng to (+)">
                    <svg class="ico ico-sm" viewBox="0 0 24 24"><use href="#i-zoom-in" /></svg>
                </button>
                <span class="vsep"></span>
                <button class="icon-btn" data-cmd="view.fit" title="Vừa màn hình (F)">
                    <svg class="ico ico-sm" viewBox="0 0 24 24"><use href="#i-fit" /></svg>
                </button>
            </div>
        </div>

        <footer id="statusbar">
            <span class="st-item mono" id="st-coord">0, 0</span>
            <span class="st-sep"></span>
            <span class="st-item" id="st-sel">Chưa chọn</span>
            <span class="st-sep"></span>
            <span class="st-item" id="st-count">0 terrain</span>
            <span class="st-sep hide-sm"></span>
            <span class="st-item hide-sm" id="st-save">
                <svg class="ico ico-sm" viewBox="0 0 24 24"><use href="#i-check" /></svg>
                <span id="st-save-text">Đã lưu</span>
            </span>
            <span class="st-hint hide-sm" id="st-hint"></span>
        </footer>
    </div>

    <div id="modal-root"></div>
    <div id="toast-root"></div>

    <!-- One module, and the import graph decides the order — which is the
         whole point of the move. This was nine `<script>` tags whose sequence
         was load-bearing and stated nowhere but here. -->
    <script type="module" src="/src/mapEditor/main.ts"></script>
</body>

</html>
